version: "3.8"

services:
  postgresql:
    image: postgres:13
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    command: ["node", "dist/server.js"]
    depends_on:
      - redis
      - temporal
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-task-queue
      # Points at itself - the mock supplier endpoints live in this same app.
      - SUPPLIER_A_URL=http://app:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://app:3000/supplierB/hotels
    ports:
      - "3000:3000"

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on:
      - redis
      - temporal
      - app
    environment:
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-task-queue
      - SUPPLIER_A_URL=http://app:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://app:3000/supplierB/hotels

volumes:
  postgres-data:
